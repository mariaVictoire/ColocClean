services:
  postgres:
    image: postgres:16-alpine
    container_name: coloclean-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coloclean
      POSTGRES_PASSWORD: coloclean
      POSTGRES_DB: coloclean
    volumes:
      - coloclean_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coloclean -d coloclean"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coloclean_pg_data:
